########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/equipment-augment-1-0:protocol-collection/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        description: 'Empty string accepted from external applications.'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        description: 'Empty string accepted from external applications.'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
    mountName:
      name: mountName
      in: path
      required: true
      schema:
        type: string
        example: '222250001'
      description: 'The mountName of the device that is addressed by the request'
    uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Instance identifier that is unique within the device'
    uuid1:
      name: uuid1
      in: path
      required: true
      schema:
        type: string
        example: 'LTP-MWPS-TTP-1-1'
      description: 'Another instance identifier that is unique within the device'
    name_dest_mac_address:
      name: name_dest_mac_address
      in: path
      required: true
      schema:
        type: string
        example: 'LP-MWPS-TTP-1-1LTP-ETHERNETCONTAINER-TTP-6-4'
      description: 'Instance identifier that is unique within its list'
    fields:
      name: fields
      in: query
      required: false
      schema:
        type: string
        example: 'node(node-id;netconf-node-topology:connection-status)'
      description: 'Query parameter to filter ressources according to RFC8040 fields filter spec'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
        backend-time:
          schema:
            type: integer
            example: 850
          description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  headers:
    x-correlator:
      schema:
        type: string
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
    exec-time:
      schema:
        type: integer
        example: 1100
      description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    backend-time:
      schema:
        type: integer
        example: 850
      description: 'Value written by the service provider, reporting the elapsed time for data retrieval from the backend (service invocation, database access…). Expressed in milliseconds'
    life-cycle-state:
      schema:
        type: string
        enum:
          - 'EXPERIMENTAL'
          - 'OPERATIONAL'
          - 'DEPRECATED'
          - 'OBSOLETE'
          - 'UNKNOWN'
          - 'NOT_YET_DEFINED'
        example: 'EXPERIMENTAL'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    lldp-pac:
      type: object
      required:
        - local-system-data
        - lldp-configuration
        - lldp-status
        - remote-statistics
        - message-fast-tx
        - message-tx-hold-multiplier
        - message-tx-interval
        - reinit-delay
        - tx-credit-max
        - tx-fast-init
        - notification-interval
        - port-list
      properties:
        local-system-data:
          $ref: '#/components/schemas/local-system-data'
        lldp-configuration:
          $ref: '#/components/schemas/lldp-configuration'
        lldp-status:
          $ref: '#/components/schemas/lldp-status'
        remote-statistics:
          $ref: '#/components/schemas/remote-statistics'
        port-list:
          $ref: '#/components/schemas/port-list'
          x-key: name dest-mac-address
        message-fast-tx:
          type: integer
          format: int16
        message-tx-hold-multiplier:
          type: integer
          format: int8
        message-tx-interval:
          type: integer
          format: int16
        reinit-delay:
          type: integer
          format: int8
        tx-credit-max:
          type: integer
          format: int8
        tx-fast-init:
          type: integer
          format: int8
        notification-interval:
          type: integer
          format: int16
        port-list:
          type: array
          items:
            type: object
            required:
              - name
              - dest-mac-address
              - admin-status
              - notification-enable
              - tlvs-tx-enable
              - message-fast-tx
              - message-tx-hold-multiplier
              - message-tx-interval
              - reinit-delay
              - tx-credit-max
              - tx-fast-init
              - notification-interval
              - port-id-subtype
              - port-id
              - port-desc
              - tx-statistics
              - rx-statistics
            properties:
              name:
                type: string
              dest-mac-address:
                type: string
                pattern: '^[0-9a-fA-F]{2}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}:[0-9a-fA-F]{2}$'
              admin-status:
                type: string
                enum:
                  - 'lldp-1-0:ADMIN_STATUS_TYPE_DISABLED'
                  - 'lldp-1-0:ADMIN_STATUS_TYPE_TX_AND_RX'
                  - 'lldp-1-0:ADMIN_STATUS_TYPE_RX_ONLY'
                  - 'lldp-1-0:ADMIN_STATUS_TYPE_TX_ONLY'
                  - 'lldp-1-0:ADMIN_STATUS_TYPE_NOT_YET_DEFINED'
              notification-enable:
                type: boolean
              tlvs-tx-enable:
                type: object
                required:
                  - port-desc
                  - sys-name
                  - sys-desc
                  - sys-cap
                properties:
                  port-desc:
                    type: boolean
                  sys-name:
                    type: boolean
                  sys-desc:
                    type: boolean
                  sys-cap:
                    type: boolean
              message-fast-tx:
                type: integer
                format: int16
              message-tx-hold-multiplier:
                type: integer
                format: int8
              message-tx-interval:
                type: integer
                format: int16
              reinit-delay:
                type: integer
                format: int8
              tx-credit-max:
                type: integer
                format: int8
              tx-fast-init:
                type: integer
                format: int8
              notification-interval:
                type: integer
                format: int16
              management-address-tx-port-list:
                type: array
                x-key: address-subtype man-address
                items:
                  type: object
                  required:
                    - address-subtype
                    - man-address
                    - tx-enable
                    - addr-len
                    - if-subtype
                    - if-id
                  properties:
                    address-subtype:
                      type: string
                      enum:
                        - 'lldp-1-0:ADDRESS_FAMILY_TYPE_IPV4'
                        - 'lldp-1-0:ADDRESS_FAMILY_TYPE_IPV6'
                        - 'lldp-1-0:ADDRESS_FAMILY_TYPE_NOT_YET_DEFINED'                   
                    man-address:
                      type: string
                      pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                    tx-enable:
                      type: boolean
                    addr-len:
                      type: integer
                      format: int32
                    if-subtype:
                      type: string
                      enum:
                        - 'lldp-1-0:MAN_ADDR_IF_SUBTYPE_TYPE_UNKNOWN'
                        - 'lldp-1-0:MAN_ADDR_IF_SUBTYPE_TYPE_PORT_REF'
                        - 'lldp-1-0:MAN_ADDR_IF_SUBTYPE_TYPE_SYSTEM_PORT_NUMBER'
                        - 'lldp-1-0:MAN_ADDR_IF_SUBTYPE_TYPE_NOT_YET_DEFINED'
                    if-id:
                      type: integer
                      format: int32
              port-id-subtype:
                type: string
                enum:
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_INTERFACE_ALIAS'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_PORT_COMPONENT'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_MAC_ADDRESS'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_NETWORK_ADDRESS'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_INTERFACE_NAME'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_AGENT_CIRCUIT_ID'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_LOCAL'
                  - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_NOT_YET_DEFINED'
              port-id:
                type: string
              port-desc:
                type: string
              tx-statistics:
                type: object
                required:
                  - total-frames
                  - total-length-errors
                properties:
                  total-frames:
                    type: integer
                    format: int32
                  total-length-errors:
                    type: integer
                    format: int32
              rx-statistics:
                type: object
                required:
                  - total-ageouts
                  - total-discarded-frames
                  - error-frames
                  - total-frames
                  - total-discarded-tlvs
                  - total-unrecognized-tlvs
                properties:
                  total-ageouts:
                    type: integer
                    format: int32
                  total-discarded-frames:
                    type: integer
                    format: int32
                  error-frames:
                    type: integer
                    format: int32
                  total-frames:
                    type: integer
                    format: int32
                  total-discarded-tlvs:
                    type: integer
                    format: int32
                  total-unrecognized-tlvs:
                    type: integer
                    format: int32
              remote-systems-data-list:
                type: array
                x-key: time-mark remote-index
                items:
                  type: object
                  required:
                    - time-mark
                    - remote-index
                  properties:
                    time-mark:
                      type: integer
                      format: int32
                    remote-index:
                      type: integer
                      format: uint8
                    remote-too-many-neighbors:
                      type: boolean
                    remote-changes:
                      type: boolean
                    chassis-id-subtype:
                      type: string
                      enum:
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_CHASSIS_COMPONENT'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_INTERFACE_ALIAS'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_PORT_COMPONENT'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_MAC_ADDRESS'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_NETWORK_ADDRESS'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_INTERFACE_NAME'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_LOCAL'
                        - 'lldp-1-0:CHASSIS_ID_SUBTYPE_TYPE_NOT_YET_DEFINED'
                    chassis-id:
                      type: string
                    port-id-subtype:
                      type: string
                      enum:
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_INTERFACE_ALIAS'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_PORT_COMPONENT'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_MAC_ADDRESS'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_NETWORK_ADDRESS'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_INTERFACE_NAME'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_AGENT_CIRCUIT_ID'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_LOCAL'
                        - 'lldp-1-0:PORT_ID_SUBTYPE_TYPE_NOT_YET_DEFINED'
                    port-desc:
                      type: string
                    port-id:
                      type: string
                    system-name:
                      type: string
                    system-description:
                      type: string
                    system-capabilities-supported:
                      type: object
                      properties:
                        other:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        repeater:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                     
                        bridge:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        wlan-access-point:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                      
                        router:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        telephone:
