                        other:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        repeater:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                     
                        bridge:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        wlan-access-point:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                      
                        router:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        telephone:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                      
                        docsis-cable-device:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'
                        station-only:
                          type: string
                          enum:
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_TRUE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_FALSE'
                            - 'lldp-1-0:CAPABILITY_VALUE_TYPE_NOT_YET_DEFINED'                      
                        cvlan-component:
                          type: string
